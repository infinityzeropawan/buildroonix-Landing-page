<svg viewBox="0 0 600 650" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Glow Filters -->
    <filter id="vectorGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.45" />
    </filter>

    <!-- Gradients -->
    <!-- 1. Top-Left Green/Cyan Gradient (3D Printing Beam) -->
    <linearGradient id="gradGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#68f36b" />
      <stop offset="100%" stop-color="#00e5ff" />
    </linearGradient>

    <!-- 2. Top-Right Blue/Purple Gradient (Hardware PCB) -->
    <linearGradient id="gradBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#26a9ff" />
      <stop offset="100%" stop-color="#7c4dff" />
    </linearGradient>

    <!-- 3. Bottom Orange/Red Gradient (Code Block) -->
    <linearGradient id="gradOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7212" />
      <stop offset="100%" stop-color="#ff3d00" />
    </linearGradient>

    <!-- 4. Text Gradients -->
    <linearGradient id="txtGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4caf50" />
      <stop offset="100%" stop-color="#68f36b" />
    </linearGradient>

    <linearGradient id="txtOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff7212" />
      <stop offset="100%" stop-color="#ff9100" />
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#68f36b" />
      <stop offset="50%" stop-color="#26a9ff" />
      <stop offset="100%" stop-color="#ff7212" />
    </linearGradient>
  </defs>

  <style>
    .brand-txt-build {
      font-family: 'Inter', 'Manrope', 'Montserrat', sans-serif;
      font-weight: 900;
      font-size: 54px;
      letter-spacing: 0.04em;
      fill: url(#txtGreen);
    }
    .brand-txt-roonix {
      font-family: 'Inter', 'Manrope', 'Montserrat', sans-serif;
      font-weight: 900;
      font-size: 54px;
      letter-spacing: 0.04em;
      fill: url(#txtOrange);
    }
    .code-symbol {
      font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
      font-weight: 800;
      font-size: 34px;
      fill: #ffffff;
    }
  </style>

  <!-- Root Group with Shadow -->
  <g filter="url(#softShadow)">
    
    <!-- MAIN ISOMETRIC 3D "B" LOGO MARK -->
    <g transform="translate(50, 20)">
      

      <!-- 1. LEFT ISOMETRIC SPINE (3D Green/Cyan Pillar) -->
      <!-- Back 3D depth shadow face -->
      <polygon points="170,120 220,90 220,380 170,410" fill="#0d47a1" opacity="0.3" />
      
      <!-- Main Green Spine Face -->
      <path d="M 170,120 L 250,75 L 250,380 L 170,425 Z" fill="url(#gradGreen)" />
      <!-- Top isometric bevel cap -->
      <polygon points="170,120 250,75 290,95 210,140" fill="#b9f6ca" opacity="0.8" />

      <!-- 2. TOP LOOP (3D PRINTING STUDIO - Cyan/Blue) -->
      <!-- Outer Top Beam -->
      <path d="M 250,75 L 390,145 L 390,210 L 320,175 L 250,210 L 250,75 Z" fill="url(#gradGreen)" />
      <!-- Top Inner Cutout & Bed platform -->
      <polygon points="265,200 370,147 370,250 265,300" fill="#0c1921" />

      <!-- 3D PRINTER NOZZLE & EXTRUDED VASE (Inside Top Loop) -->
      <!-- Nozzle Mount Assembly -->
      <rect x="305" y="145" width="26" height="14" rx="2" fill="#e0e0e0" />
      <polygon points="312,159 324,159 318,172" fill="#ffb74d" />
      
      <!-- Extruded 3D Printed Vase -->
      <path d="M 304,225 C 290,205 346,205 332,225 C 348,245 288,245 304,225 Z" fill="#00e5ff" opacity="0.85" filter="url(#vectorGlow)" />
      <path d="M 312,172 L 318,205" stroke="#68f36b" stroke-width="2.5" stroke-dasharray="4,2">
        
      </path>

      <!-- 3. TOP-RIGHT LOOP (HARDWARE / PCB CIRCUIT - Blue/Purple) -->
      <path d="M 390,145 L 450,175 L 450,285 L 370,325 L 320,300 L 390,265 L 390,145 Z" fill="url(#gradBlue)" />
      
      <!-- IC MICROCHIP (Top Right Edge) -->
      <g transform="translate(420, 160) rotate(26)">
        <rect x="0" y="0" width="28" height="20" rx="3" fill="#1e272c" stroke="#64ffda" stroke-width="1.5" />
        <!-- Chip Pins -->
        <line x1="-4" y1="5" x2="0" y2="5" stroke="#ccc" stroke-width="1.5" />
        <line x1="-4" y1="10" x2="0" y2="10" stroke="#ccc" stroke-width="1.5" />
        <line x1="-4" y1="15" x2="0" y2="15" stroke="#ccc" stroke-width="1.5" />
        <line x1="28" y1="5" x2="32" y2="5" stroke="#ccc" stroke-width="1.5" />
        <line x1="28" y1="10" x2="32" y2="10" stroke="#ccc" stroke-width="1.5" />
        <line x1="28" y1="15" x2="32" y2="15" stroke="#ccc" stroke-width="1.5" />
      </g>

      <!-- PCB Circuit Traces & Nodes -->
      <path d="M 430,200 L 410,210 L 410,250 M 410,225 L 380,240" fill="none" stroke="#68f36b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
      <circle cx="430" cy="200" r="3.5" fill="#68f36b" filter="url(#vectorGlow)">
        
      </circle>
      <circle cx="380" cy="240" r="3.5" fill="#26a9ff" filter="url(#vectorGlow)">
        
      </circle>

      <!-- 4. BOTTOM-RIGHT LOOP (SOFTWARE / CODE BLOCK - Orange) -->
      <path d="M 250,290 L 370,230 L 450,270 L 450,380 L 370,420 L 250,360 Z" fill="url(#gradOrange)" />
      <polygon points="270,305 365,255 430,288 335,338" fill="#ff6d00" opacity="0.4" />
      
      <!-- CODE BRACKET SYMBOL (</>) -->
      <g transform="translate(325, 335) rotate(-10)">
        <text x="0" y="0" class="code-symbol" text-anchor="middle">&lt;/&gt;</text>
      </g>

      <!-- Glowing Corner LED Indicator Dots -->
      <circle cx="185" cy="135" r="4" fill="#68f36b" filter="url(#vectorGlow)">
        
      </circle>
      <circle cx="435" cy="190" r="4" fill="#26a9ff" filter="url(#vectorGlow)">
        
      </circle>
      <circle cx="435" cy="370" r="4" fill="#ff7212" filter="url(#vectorGlow)">
        
      </circle>

    </g>

    <!-- TYPOGRAPHY BRAND NAME: BUILDROONIX -->
    <g transform="translate(300, 550)">
      <text x="0" y="0" text-anchor="middle">
        <tspan class="brand-txt-build">BUILD</tspan>
        <tspan class="brand-txt-roonix">ROONIX</tspan>
      </text>
    </g>
  </g>
</svg>