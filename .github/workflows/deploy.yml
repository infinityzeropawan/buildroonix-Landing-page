name: Buildroonix Landing — Auto Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy buildroonix.com to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            set -e
            echo "📦 Setting safe directory..."
            git config --global --add safe.directory /var/www/buildroonix

            echo "📦 Fetching latest code and cleaning workspace..."
            cd /var/www/buildroonix
            git reset --hard HEAD
            git fetch origin main
            git reset --hard origin/main
            git clean -fd

            echo "📦 Installing dependencies..."
            npm install --silent

            echo "🏗️  Building Next.js production bundle..."
            npm run build

            echo "♻️  Restarting PM2 process (buildroonix-landing only)..."
            pm2 delete buildroonix-landing 2>/dev/null || true
            pm2 start ecosystem.config.js --env production
            pm2 save

            echo "✅ buildroonix.com deployed successfully!"
            pm2 status buildroonix-landing
