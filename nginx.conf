# NGINX Configuration for buildroonix.com (Landing Page)
# File: /etc/nginx/sites-available/buildroonix.com
#
# ⚠️  This is a SEPARATE vhost from 3d.buildroonix.com (port 3001)
# This config ONLY handles: buildroonix.com + www.buildroonix.com → port 8080

server {
    listen 80;
    listen [::]:80;
    server_name buildroonix.com www.buildroonix.com;

    # Certbot will insert HTTPS redirect here automatically
    return 301 https://buildroonix.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name buildroonix.com www.buildroonix.com;

    # SSL — Certbot will auto-populate these
    # ssl_certificate     /etc/letsencrypt/live/buildroonix.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/buildroonix.com/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # www → non-www redirect
    if ($host = www.buildroonix.com) {
        return 301 https://buildroonix.com$request_uri;
    }

    # Increase payload limits for Admin image uploads
    client_max_body_size 25M;

    # Gzip compression for performance
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Main app (Express server on port 8080)
    location / {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Admin portal shortcut route
    location = /admin {
        proxy_pass         http://127.0.0.1:8080/admin.html;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Health check endpoint (no logging needed)
    location = /api/health {
        proxy_pass         http://127.0.0.1:8080/api/health;
        access_log off;
    }
}
