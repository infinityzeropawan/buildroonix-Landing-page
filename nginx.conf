# NGINX Configuration for buildroonix.com
# Place this file at /etc/nginx/sites-available/buildroonix.com

server {
    listen 80;
    listen [::]:80;
    server_name buildroonix.com www.buildroonix.com;

    # Redirect HTTP to HTTPS (certbot will auto-populate HTTPS block)
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Separate Admin Route Alias
    location /admin {
        proxy_pass http://127.0.0.1:8080/admin.html;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Increase payload limits for image uploads in Admin
    client_max_body_size 25M;
}
